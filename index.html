<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
      name="description"
      content="Përmbledhje edukative me shembuj të HTML-së, CSS-së dhe JavaScript-it, si dhe një demonstrim të thjeshtë ndërveprues."
    />
    <title>Përmbledhje HTML, CSS dhe JavaScript | CodeLab</title>
    
    <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="styles.css" />
  </head>
    <body class="cards">
      
    <nav class="topbar">
      <div class="logo">CodeLab</div>
      <ul>
        <li><a href="#html">HTML</a></li>
        <li><a href="#css">CSS</a></li>
        <li><a href="#js">JavaScript</a></li>
      </ul>
      <button id="themeToggle" type="button">Ndrysho temën</button>
    </nav>

    <header class="hero">

            <div class="hero-content">
        <div class="hero-text">
          <p class="eyebrow">Projekt i thjeshtë</p>
          <h1>HTML + CSS + JavaScript</h1>
          <p class="lead">
            Një projekt edukativ me komanda dhe shembuj të zakonshëm
            për HTML, CSS dhe JS.
          </p>
                    <button id="showMessageBtn" type="button">
            Shfaq mesazh
          </button>
          <p id="messageOutput" aria-live="polite"></p>
        </div>

        <div class="code-preview">
          <pre><code id="heroSnippet"></code></pre>
        </div>
      </div>
    </header>

    <main>
      <p id="snippetStatus" role="status">Duke ngarkuar shembujt…</p>
      <noscript>Aktivizo JavaScript për të parë shembujt.</noscript>
      <div id="snippetSections" aria-busy="true"></div>

      <section class="panel demo">
        <h2>Demo JavaScript</h2>
          <form id="greetForm" class="demo-box">
            <label for="nameInput">Emri yt</label>

            <input
            id="nameInput"
            type="text"
            placeholder="Shkruaj emrin tend"
            />

            <button id="greetBtn" type="submit">
              Pershendetje
            </button>

            <p id="output" aria-live="polite">
              Teksti do te shfaqet ketu.
            </p>
          </form>
      </section>
    </main>

    <footer>
      <p>© <span id="year"></span> CodeLab - Projekt HTML CSS JS</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
